[workspace]
members = ["crates/openpapir-core", "crates/openpapir-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/watt-mind/openPapir"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
getrandom = "0.3.3"
libc = "0.2.174"
proptest = { version = "1.11.0", default-features = false, features = ["bit-set", "std"] }
tempfile = "3.10.1"
