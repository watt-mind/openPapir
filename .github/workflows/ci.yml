name: CI
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-machete@0.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Windows target is linted from this Linux runner because clippy
      # checks without linking, so the platform-specific code paths are seen
      # on every pull request and not only in the Windows test job.
      - run: rustup target add x86_64-pc-windows-msvc
      - run: >
          cargo clippy --workspace --all-targets --locked
          --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo machete
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep these four commands identical to the documentation section of
      # scripts/check.sh, so a local run and CI accept exactly the same tree.
      - run: >
          npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#target" "#samples"
          "#refs" "#tmp" "#node_modules"
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/check-file-length.py
      - run: python3 scripts/check-prose.py
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Release CLI smoke
        shell: bash
        run: |
          target/release/openpapir --help
          target/release/openpapir --version
          target/release/openpapir capabilities --json
      # The same script the release workflow stages an archive with, run on
      # the binary just built. It generates the completion scripts and the man
      # page and checks the staged layout, so a pull request exercises the
      # packaging on each of the three platforms the release matrix builds on,
      # without a tag and without creating an archive.
      #
      # The staged tree is then diffed against the listing the same script
      # prints, so the description a release carries and the files a release
      # ships are checked against each other on every pull request. The
      # staging directory is ignored by Git, so a local run of this step
      # leaves no untracked tree behind.
      - name: Check the release archive layout
        shell: bash
        run: |
          set -euo pipefail
          staging=staging/openpapir-ci
          scripts/package-release.sh target/release/openpapir "$staging"
          name=openpapir
          if [ -f "${staging}/openpapir.exe" ]; then
            name=openpapir.exe
          fi
          diff \
            <(scripts/package-release.sh --describe --paths "$name" |
              LC_ALL=C sort) \
            <(cd "$staging" && find . -type f |
              sed 's|^\./||' | LC_ALL=C sort)
  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Single source for the MSRV inside this job: the toolchain selection, the
    # banner assertion and the Cargo.toml guard all read it. Only the job name
    # and the toolchain action pin comment still spell the version out.
    env:
      MSRV: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88 @ 2026-09-03
      # The cache key has to name the MSRV: this job compiles under
      # ${{ env.MSRV }}, not under the stable rustc the action would otherwise
      # derive the key from, and a stable-keyed cache never hits here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-msrv-${{ env.MSRV }}
      # rust-toolchain.toml pins the channel to stable and overrides `rustup
      # default`, so the MSRV steps below select the MSRV through
      # RUSTUP_TOOLCHAIN.
      - name: Show the toolchain the MSRV check runs on
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        run: |
          cargo --version
          rustc --version
          rustc --version | grep -q "^rustc ${MSRV} "
      - name: Check that Cargo.toml still declares the MSRV
        run: grep -qx "rust-version = \"${MSRV%.*}\"" Cargo.toml
      - name: Check the workspace on the MSRV toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        run: cargo check --workspace --all-targets --locked
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 90
  hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" |
            while IFS= read -r subject; do
              printf '%s\n' "$subject" | sh scripts/commit-msg.sh -
            done
